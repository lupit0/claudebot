name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/guitar-to-piano-converter-cs6mN]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and build
        working-directory: guitar-to-piano
        run: |
          npm install
          npm run build

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: guitar-to-piano/dist

      - id: deployment
        uses: actions/deploy-pages@v4
